<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Космическая Анимация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: radial-gradient(ellipse at center, #0a0e27 0%, #1a1a3f 50%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .space-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Звёзды фона */
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Планета Земля */
        .earth {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #87ceeb, #1e90ff 30%, #0047ab 70%);
            box-shadow: 0 0 60px rgba(30, 144, 255, 0.8), inset -20px -20px 60px rgba(0, 0, 0, 0.5);
            left: 10%;
            top: 20%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotateZ(0deg); }
            50% { transform: translateY(-30px) rotateZ(10deg); }
        }

        /* Луна */
        .moon {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #f5f5dc, #d3d3d3 40%, #808080 100%);
            box-shadow: 0 0 40px rgba(200, 200, 200, 0.6), inset -15px -15px 40px rgba(0, 0, 0, 0.6);
            right: 15%;
            top: 30%;
            animation: orbitMoon 8s linear infinite;
        }

        @keyframes orbitMoon {
            0% { transform: translateX(0) rotateZ(0deg); }
            100% { transform: translateX(100px) rotateZ(360deg); }
        }

        /* Солнце */
        .sun {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #ffd700, #ff8c00 30%, #ff4500 100%);
            box-shadow: 0 0 100px rgba(255, 140, 0, 0.9), 0 0 150px rgba(255, 69, 0, 0.6);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { 
                box-shadow: 0 0 100px rgba(255, 140, 0, 0.9), 0 0 150px rgba(255, 69, 0, 0.6);
                transform: translate(-50%, -50%) scale(1);
            }
            50% { 
                box-shadow: 0 0 150px rgba(255, 140, 0, 1), 0 0 200px rgba(255, 69, 0, 0.8);
                transform: translate(-50%, -50%) scale(1.1);
            }
        }

        /* Кольца Сатурна */
        .saturn {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #fad5a5, #e6b84d 30%, #d4a574 100%);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.6), inset -15px -15px 40px rgba(0, 0, 0, 0.5);
            right: 20%;
            bottom: 25%;
            animation: rotateSaturn 20s linear infinite;
        }

        .saturn::before {
            content: '';
            position: absolute;
            width: 180px;
            height: 50px;
            border: 3px solid rgba(200, 180, 100, 0.6);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(75deg);
            box-shadow: 0 0 20px rgba(200, 180, 100, 0.3);
        }

        @keyframes rotateSaturn {
            0% { transform: rotateZ(0deg); }
            100% { transform: rotateZ(360deg); }
        }

        /* Юпитер */
        .jupiter {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #ffc86a, #d4a574 20%, #8b6f47 50%, #5d4e37 100%);
            box-shadow: 0 0 70px rgba(212, 165, 116, 0.7), inset -20px -20px 50px rgba(0, 0, 0, 0.6);
            left: 75%;
            top: 10%;
            animation: floatJupiter 7s ease-in-out infinite;
        }

        .jupiter::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 20px;
            background: linear-gradient(to bottom, transparent, rgba(91, 62, 23, 0.4));
            top: 30%;
            left: 0;
            border-radius: 50%;
        }

        @keyframes floatJupiter {
            0%, 100% { transform: translateY(0) rotateZ(0deg); }
            50% { transform: translateY(-25px) rotateZ(5deg); }
        }

        /* Нептун */
        .neptune {
            position: absolute;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #4169e1, #1e90ff 30%, #00008b 70%);
            box-shadow: 0 0 60px rgba(65, 105, 225, 0.8), inset -15px -15px 40px rgba(0, 0, 0, 0.6);
            left: 5%;
            bottom: 15%;
            animation: floatNeptune 8s ease-in-out infinite;
        }

        @keyframes floatNeptune {
            0%, 100% { transform: translateY(0) rotateZ(0deg); }
            50% { transform: translateY(-35px) rotateZ(-8deg); }
        }

        /* Марс */
        .mars {
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ff6347, #cd5c5c 30%, #8b3a3a 70%);
            box-shadow: 0 0 50px rgba(255, 99, 71, 0.7), inset -12px -12px 35px rgba(0, 0, 0, 0.6);
            right: 10%;
            bottom: 20%;
            animation: floatMars 9s ease-in-out infinite;
        }

        @keyframes floatMars {
            0%, 100% { transform: translateY(0) rotateZ(0deg); }
            50% { transform: translateY(-20px) rotateZ(12deg); }
        }

        /* Астероиды */
        .asteroid {
            position: absolute;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle at 30% 30%, #8b7355, #654321 70%);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(139, 115, 85, 0.5);
        }

        .asteroid:nth-child(1) {
            left: 20%;
            bottom: 20%;
            animation: floatAsteroid 15s infinite linear;
        }

        .asteroid:nth-child(2) {
            right: 25%;
            top: 15%;
            animation: floatAsteroid 20s infinite linear reverse;
        }

        .asteroid:nth-child(3) {
            left: 70%;
            bottom: 30%;
            animation: floatAsteroid 18s infinite linear;
        }

        .asteroid:nth-child(4) {
            right: 35%;
            top: 45%;
            animation: floatAsteroid 22s infinite linear reverse;
        }

        .asteroid:nth-child(5) {
            left: 45%;
            top: 60%;
            animation: floatAsteroid 17s infinite linear;
        }

        @keyframes floatAsteroid {
            0% { transform: translateX(0) translateY(0) rotateZ(0deg); }
            100% { transform: translateX(200px) translateY(-200px) rotateZ(360deg); }
        }

        /* Кометы */
        .comet {
            position: absolute;
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ffff, 0 0 20px #0099ff;
        }

        .comet::after {
            content: '';
            position: absolute;
            width: 200px;
            height: 2px;
            background: linear-gradient(to right, #00ffff, transparent);
            right: 5px;
            top: 0;
        }

        .comet:nth-child(6) {
            animation: cometFly 8s infinite ease-in;
            left: 0;
            top: 30%;
        }

        .comet:nth-child(7) {
            animation: cometFly 10s infinite ease-in 2s;
            right: 0;
            bottom: 30%;
        }

        .comet:nth-child(8) {
            animation: cometFly 12s infinite ease-in 4s;
            left: 20%;
            top: 10%;
        }

        @keyframes cometFly {
            0% {
                transform: translateX(0) translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateX(800px) translateY(200px);
                opacity: 0;
            }
        }

        /* Спутники */
        .satellite {
            position: absolute;
            width: 15px;
            height: 15px;
            background: radial-gradient(circle at 30% 30%, #c0c0c0, #808080 60%);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(192, 192, 192, 0.7);
        }

        .satellite:nth-child(9) {
            animation: orbitSatellite1 10s linear infinite;
            left: 45%;
            top: 40%;
        }

        .satellite:nth-child(10) {
            animation: orbitSatellite2 12s linear infinite reverse;
            right: 30%;
            top: 50%;
        }

        @keyframes orbitSatellite1 {
            0% { transform: translate(0, 0) rotateZ(0deg); }
            100% { transform: translate(150px, 100px) rotateZ(360deg); }
        }

        @keyframes orbitSatellite2 {
            0% { transform: translate(0, 0) rotateZ(0deg); }
            100% { transform: translate(-150px, -100px) rotateZ(-360deg); }
        }

        /* Туманности */
        .nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
        }

        .nebula:nth-child(11) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #ff00ff, transparent);
            left: 5%;
            top: 10%;
            animation: nebulaPulse 6s ease-in-out infinite;
        }

        .nebula:nth-child(12) {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #00ffff, transparent);
            right: 10%;
            bottom: 10%;
            animation: nebulaPulse 8s ease-in-out infinite reverse;
        }

        .nebula:nth-child(13) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #ff6600, transparent);
            left: 50%;
            top: 30%;
            animation: nebulaPulse 7s ease-in-out infinite;
            opacity: 0.2;
        }

        @keyframes nebulaPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.2) rotate(180deg); }
        }

        /* Пыльные облака */
        .dust-cloud {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.2;
            background: radial-gradient(circle, rgba(100, 100, 150, 0.5), transparent);
        }

        .dust-cloud:nth-child(14) {
            width: 500px;
            height: 300px;
            left: 10%;
            top: 50%;
            animation: driftCloud1 15s ease-in-out infinite;
        }

        .dust-cloud:nth-child(15) {
            width: 400px;
            height: 350px;
            right: 5%;
            top: 20%;
            animation: driftCloud2 20s ease-in-out infinite;
        }

        @keyframes driftCloud1 {
            0%, 100% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(50px) translateY(-30px); }
        }

        @keyframes driftCloud2 {
            0%, 100% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(-60px) translateY(40px); }
        }

        /* Текст */
        .title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff;
            font-size: 4em;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #0099ff;
            z-index: 100;
            animation: textGlow 3s ease-in-out infinite;
            letter-spacing: 3px;
        }

        @keyframes textGlow {
            0%, 100% { 
                text-shadow: 0 0 20px #00ffff, 0 0 40px #0099ff;
            }
            50% { 
                text-shadow: 0 0 30px #00ffff, 0 0 60px #0099ff, 0 0 80px #ff00ff;
            }
        }

        .subtitle {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff88;
            font-size: 1.2em;
            text-shadow: 0 0 10px #00ff88;
            letter-spacing: 2px;
            animation: fadeInOut 4s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Звёздные поля */
        .star-field {
            position: absolute;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="space-container">
        <!-- Звёздные поля -->
        <div class="star-field" id="starField"></div>

        <!-- Туманности -->
        <div class="nebula"></div>
        <div class="nebula"></div>
        <div class="nebula"></div>

        <!-- Пыльные облака -->
        <div class="dust-cloud"></div>
        <div class="dust-cloud"></div>

        <!-- Кометы -->
        <div class="comet"></div>
        <div class="comet"></div>
        <div class="comet"></div>

        <!-- Астероиды -->
        <div class="asteroid"></div>
        <div class="asteroid"></div>
        <div class="asteroid"></div>
        <div class="asteroid"></div>
        <div class="asteroid"></div>

        <!-- Спутники -->
        <div class="satellite"></div>
        <div class="satellite"></div>

        <!-- Планеты -->
        <div class="earth"></div>
        <div class="moon"></div>
        <div class="jupiter"></div>
        <div class="neptune"></div>
        <div class="mars"></div>
        <div class="sun"></div>
        <div class="saturn"></div>

        <!-- Текст -->
        <div class="title">КОСМОС</div>
        <div class="subtitle">✦ Исследуй бесконечность ✦</div>
    </div>

    <script>
        const container = document.querySelector('.space-container');
        const starField = document.getElementById('starField');
        
        // Генерируем случайные звёзды с разными размерами
        function createRandomStar() {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.opacity = Math.random() * 0.7 + 0.3;
            starField.appendChild(star);
        }

        // Создаём 100+ случайных звёзд
        for (let i = 0; i < 100; i++) {
            createRandomStar();
        }

        // Добавляем интерактивность при движении мыши
        document.addEventListener('mousemove', (e) => {
            const sun = document.querySelector('.sun');
            const earth = document.querySelector('.earth');
            const jupiter = document.querySelector('.jupiter');
            const neptune = document.querySelector('.neptune');
            
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;
            
            // Изменяем свечение в зависимости от позиции мыши
            sun.style.filter = `drop-shadow(0 0 ${100 + mouseX * 50}px rgba(255, 140, 0, 0.9))`;
            earth.style.boxShadow = `0 0 ${60 + mouseY * 40}px rgba(30, 144, 255, 0.8), inset -20px -20px 60px rgba(0, 0, 0, 0.5)`;
            jupiter.style.transform = `translateY(${Math.sin(Date.now() / 1000) * 25}) rotateZ(${Math.sin(Date.now() / 2000) * 5}deg)`;
            neptune.style.transform = `translateY(${Math.cos(Date.now() / 1200) * 35}) rotateZ(${Math.cos(Date.now() / 2200) * -8}deg)`;
        });

        // Плавное движение звёзд (параллакс эффект)
        window.addEventListener('scroll', () => {
            const scrollPos = window.scrollY;
            starField.style.transform = `translateY(${scrollPos * 0.5}px)`;
        });

        // Генерируем новые звёзды при изменении размера окна
        window.addEventListener('resize', () => {
            if (starField.children.length < 100) {
                for (let i = starField.children.length; i < 100; i++) {
                    createRandomStar();
                }
            }
        });
    </script>
</body>
</html>
