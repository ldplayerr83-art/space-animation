<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Космическая Анимация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: radial-gradient(ellipse at center, #0a0e27 0%, #1a1a3f 50%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .space-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Звёзды фона */
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Планета Земля */
        .earth {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #87ceeb, #1e90ff 30%, #0047ab 70%);
            box-shadow: 0 0 60px rgba(30, 144, 255, 0.8), inset -20px -20px 60px rgba(0, 0, 0, 0.5);
            left: 10%;
            top: 20%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotateZ(0deg); }
            50% { transform: translateY(-30px) rotateZ(10deg); }
        }

        /* Луна */
        .moon {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #f5f5dc, #d3d3d3 40%, #808080 100%);
            box-shadow: 0 0 40px rgba(200, 200, 200, 0.6), inset -15px -15px 40px rgba(0, 0, 0, 0.6);
            right: 15%;
            top: 30%;
            animation: orbitMoon 8s linear infinite;
        }

        @keyframes orbitMoon {
            0% { transform: translateX(0) rotateZ(0deg); }
            100% { transform: translateX(100px) rotateZ(360deg); }
        }

        /* Солнце */
        .sun {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #ffd700, #ff8c00 30%, #ff4500 100%);
            box-shadow: 0 0 100px rgba(255, 140, 0, 0.9), 0 0 150px rgba(255, 69, 0, 0.6);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { 
                box-shadow: 0 0 100px rgba(255, 140, 0, 0.9), 0 0 150px rgba(255, 69, 0, 0.6);
                transform: translate(-50%, -50%) scale(1);
            }
            50% { 
                box-shadow: 0 0 150px rgba(255, 140, 0, 1), 0 0 200px rgba(255, 69, 0, 0.8);
                transform: translate(-50%, -50%) scale(1.1);
            }
        }

        /* Кольца Сатурна */
        .saturn {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #fad5a5, #e6b84d 30%, #d4a574 100%);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.6), inset -15px -15px 40px rgba(0, 0, 0, 0.5);
            right: 20%;
            bottom: 25%;
            animation: rotateSaturn 20s linear infinite;
        }

        .saturn::before {
            content: '';
            position: absolute;
            width: 180px;
            height: 50px;
            border: 3px solid rgba(200, 180, 100, 0.6);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(75deg);
            box-shadow: 0 0 20px rgba(200, 180, 100, 0.3);
        }

        @keyframes rotateSaturn {
            0% { transform: rotateZ(0deg); }
            100% { transform: rotateZ(360deg); }
        }

        /* Астероиды */
        .asteroid {
            position: absolute;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle at 30% 30%, #8b7355, #654321 70%);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(139, 115, 85, 0.5);
        }

        .asteroid:nth-child(1) {
            left: 20%;
            bottom: 20%;
            animation: floatAsteroid 15s infinite linear;
        }

        .asteroid:nth-child(2) {
            right: 25%;
            top: 15%;
            animation: floatAsteroid 20s infinite linear reverse;
        }

        .asteroid:nth-child(3) {
            left: 70%;
            bottom: 30%;
            animation: floatAsteroid 18s infinite linear;
        }

        @keyframes floatAsteroid {
            0% { transform: translateX(0) translateY(0) rotateZ(0deg); }
            100% { transform: translateX(200px) translateY(-200px) rotateZ(360deg); }
        }

        /* Кометы */
        .comet {
            position: absolute;
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ffff, 0 0 20px #0099ff;
        }

        .comet::after {
            content: '';
            position: absolute;
            width: 200px;
            height: 2px;
            background: linear-gradient(to right, #00ffff, transparent);
            right: 5px;
            top: 0;
        }

        .comet:nth-child(4) {
            animation: cometFly 8s infinite ease-in;
            left: 0;
            top: 30%;
        }

        .comet:nth-child(5) {
            animation: cometFly 10s infinite ease-in 2s;
            right: 0;
            bottom: 30%;
        }

        @keyframes cometFly {
            0% {
                transform: translateX(0) translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateX(800px) translateY(200px);
                opacity: 0;
            }
        }

        /* Туманности */
        .nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
        }

        .nebula:nth-child(6) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #ff00ff, transparent);
            left: 5%;
            top: 10%;
            animation: nebulaPulse 6s ease-in-out infinite;
        }

        .nebula:nth-child(7) {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #00ffff, transparent);
            right: 10%;
            bottom: 10%;
            animation: nebulaPulse 8s ease-in-out infinite reverse;
        }

        @keyframes nebulaPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.2) rotate(180deg); }
        }

        /* Текст */
        .title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff;
            font-size: 4em;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #0099ff;
            z-index: 100;
            animation: textGlow 3s ease-in-out infinite;
            letter-spacing: 3px;
        }

        @keyframes textGlow {
            0%, 100% { 
                text-shadow: 0 0 20px #00ffff, 0 0 40px #0099ff;
            }
            50% { 
                text-shadow: 0 0 30px #00ffff, 0 0 60px #0099ff, 0 0 80px #ff00ff;
            }
        }

        .subtitle {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff88;
            font-size: 1.2em;
            text-shadow: 0 0 10px #00ff88;
            letter-spacing: 2px;
            animation: fadeInOut 4s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="space-container">
        <!-- Туманности -->
        <div class="nebula"></div>
        <div class="nebula"></div>

        <!-- Звёзды -->
        <div class="star" style="left: 10%; top: 10%;"></div>
        <div class="star" style="left: 20%; top: 15%; animation-delay: 1s;"></div>
        <div class="star" style="left: 30%; top: 5%; animation-delay: 2s;"></div>
        <div class="star" style="left: 80%; top: 20%; animation-delay: 0.5s;"></div>
        <div class="star" style="left: 90%; top: 10%; animation-delay: 1.5s;"></div>
        <div class="star" style="left: 15%; top: 80%; animation-delay: 2.5s;"></div>
        <div class="star" style="left: 70%; top: 85%; animation-delay: 0.3s;"></div>
        <div class="star" style="left: 85%; top: 75%; animation-delay: 1.8s;"></div>
        <div class="star" style="left: 40%; top: 10%; animation-delay: 0.8s;"></div>
        <div class="star" style="left: 60%; top: 15%; animation-delay: 2.2s;"></div>

        <!-- Кометы -->
        <div class="comet"></div>
        <div class="comet"></div>

        <!-- Астероиды -->
        <div class="asteroid"></div>
        <div class="asteroid"></div>
        <div class="asteroid"></div>

        <!-- Планеты -->
        <div class="earth"></div>
        <div class="moon"></div>
        <div class="sun"></div>
        <div class="saturn"></div>

        <!-- Текст -->
        <div class="title">КОСМОС</div>
        <div class="subtitle">✦ Исследуй бесконечность ✦</div>
    </div>

    <script>
        // Генерируем случайные звёзды
        const container = document.querySelector('.space-container');
        
        function createRandomStar() {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            star.style.width = (Math.random() * 3 + 1) + 'px';
            star.style.height = star.style.width;
            container.appendChild(star);
        }

        // Создаём 50 случайных звёзд
        for (let i = 0; i < 50; i++) {
            createRandomStar();
        }

        // Добавляем интерактивность при движении мыши
        document.addEventListener('mousemove', (e) => {
            const sun = document.querySelector('.sun');
            const earth = document.querySelector('.earth');
            
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;
            
            sun.style.filter = `drop-shadow(0 0 ${100 + mouseX * 50}px rgba(255, 140, 0, 0.9))`;
            earth.style.boxShadow = `0 0 ${60 + mouseY * 40}px rgba(30, 144, 255, 0.8), inset -20px -20px 60px rgba(0, 0, 0, 0.5)`;
        });
    </script>
</body>
</html>
